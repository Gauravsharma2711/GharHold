name: GharHold CI & Release Pipeline

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Lint, Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --set-exit-if-changed .

      - name: Static code analysis
        run: dart analyze .

      - name: Run automated test suite
        run: flutter test --coverage

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gharhold-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gharhold-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

